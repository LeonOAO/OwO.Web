<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>通關認證</title>
<style>

:root {
    --primary: #00684e;
    --primary-2: #00a77d;
    --text-main: #10271f;
    --text-soft: #5f746d;
    --glass-bg: rgba(255, 255, 255, 0.74);
    --glass-border: rgba(255, 255, 255, 0.84);
    --shadow-lg: 0 28px 80px rgba(0, 72, 54, 0.22);
    --radius-xl: 32px;
    --radius-md: 16px;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    background:
        radial-gradient(ellipse at 12% 18%, rgba(0, 167, 125, 0.28), transparent 34%),
        radial-gradient(ellipse at 88% 12%, rgba(125, 226, 194, 0.36), transparent 34%),
        radial-gradient(ellipse at 78% 88%, rgba(208, 188, 58, 0.20), transparent 38%),
        radial-gradient(ellipse at 34% 86%, rgba(255, 255, 255, 0.84), transparent 34%),
        linear-gradient(135deg, #eafff7 0%, #f8fcff 48%, #eaf2ff 100%);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;
    pointer-events: none;
    background:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.82), transparent 18%),
        radial-gradient(circle at 70% 18%, rgba(0, 167, 125, 0.16), transparent 24%),
        radial-gradient(circle at 78% 78%, rgba(208, 188, 58, 0.16), transparent 26%),
        linear-gradient(120deg, rgba(255, 255, 255, 0.52), transparent 42%, rgba(255, 255, 255, 0.36));
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    opacity: 0.38;
    background-image:
        radial-gradient(circle at 25% 25%, rgba(0, 104, 78, 0.10) 0 1px, transparent 1.4px),
        radial-gradient(circle at 75% 65%, rgba(0, 167, 125, 0.10) 0 1px, transparent 1.4px);
    background-size: 34px 34px, 46px 46px;
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.72) 18%, transparent 92%);
}

.auth-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
}

.auth-page::before {
    content: "";
    position: absolute;
    width: min(72vw, 760px);
    aspect-ratio: 1;
    border-radius: 999px;
    background: conic-gradient(from 140deg, rgba(0, 104, 78, 0), rgba(0, 167, 125, 0.22), rgba(208, 188, 58, 0.20), rgba(0, 104, 78, 0));
    filter: blur(34px);
    opacity: 0.54;
    animation: auraRotate 18s linear infinite;
}

.auth-blob {
    position: fixed;
    z-index: -1;
    width: 340px;
    height: 340px;
    border-radius: 999px;
    filter: blur(12px);
    opacity: 0.72;
    animation: blobFloat 9s ease-in-out infinite alternate;
}

.auth-blob.is-left {
    left: -130px;
    top: 12%;
    background: radial-gradient(circle, rgba(0, 167, 125, 0.42), rgba(0, 104, 78, 0.05) 68%, transparent 72%);
}

.auth-blob.is-right {
    right: -120px;
    bottom: 8%;
    animation-delay: -2.8s;
    background: radial-gradient(circle, rgba(208, 188, 58, 0.34), rgba(125, 226, 194, 0.08) 68%, transparent 72%);
}

.login-card {
    position: relative;
    width: min(100%, 460px);
    overflow: hidden;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    background: var(--glass-bg);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(24px) saturate(145%);
    -webkit-backdrop-filter: blur(24px) saturate(145%);
    padding: 34px 30px;
}

.login-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.76), transparent 48%),
        radial-gradient(circle at 18% 10%, rgba(255, 255, 255, 0.76), transparent 20%);
}

.login-card-inner {
    position: relative;
    z-index: 1;
}

.login-header {
    text-align: center;
    margin-bottom: 28px;
}

.login-logo {
    position: relative;
    width: 82px;
    height: 82px;
    display: grid;
    place-items: center;
    margin: 0 auto 16px;
    border-radius: 24px;
    background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(236, 255, 248, 0.78));
    border: 1px solid rgba(0, 104, 78, 0.12);
    box-shadow:
        0 18px 34px rgba(0, 72, 54, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    overflow: hidden;
    animation: owlFloat 3.8s ease-in-out infinite;
    will-change: transform;
}

.login-logo::before {
    content: "";
    position: absolute;
    inset: -14px;
    z-index: -1;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(255, 205, 93, 0.32), rgba(0, 167, 125, 0.14), transparent 68%);
    filter: blur(8px);
    opacity: 0.72;
    animation: owlGlow 3.8s ease-in-out infinite;
}

.login-logo img {
    width: 62px;
    height: 62px;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    animation: owlTinyTilt 3.8s ease-in-out infinite;
    transform-origin: 50% 70%;
    will-change: transform;
}

.login-title {
    margin: 0;
    color: #06291f;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 950;
    letter-spacing: -0.02em;
}

.login-subtitle {
    margin: 10px 0 0;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.7;
    font-weight: 700;
}

.login-form {
    display: grid;
    gap: 16px;
}

.field-group {
    display: grid;
    gap: 8px;
}

.field-label {
    color: #123026;
    font-size: 14px;
    font-weight: 900;
}

.input-wrap {
    position: relative;
}

.input-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    color: var(--primary);
    opacity: 0.88;
    pointer-events: none;
}

.form-input {
    width: 100%;
    height: 54px;
    border: 1px solid rgba(0, 104, 78, 0.16);
    border-radius: var(--radius-md);
    padding: 0 48px;
    color: #0d2d23;
    background: rgba(255, 255, 255, 0.78);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78), 0 8px 20px rgba(0, 72, 54, 0.07);
    outline: none;
    font-size: 16px;
    font-weight: 800;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.form-input::placeholder {
    color: rgba(95, 116, 109, 0.70);
    font-weight: 700;
}

.form-input:focus {
    border-color: rgba(0, 167, 125, 0.82);
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 0 0 5px rgba(0, 167, 125, 0.14), 0 12px 26px rgba(0, 72, 54, 0.11);
    transform: translateY(-1px);
}

.field-hint {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-4px);
    color: #00684e;
    background: rgba(0, 104, 78, 0.08);
    border: 1px solid rgba(0, 104, 78, 0.14);
    border-radius: 12px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.45;
    transition: max-height 0.22s ease, opacity 0.22s ease, transform 0.22s ease, padding 0.22s ease;
}

.field-group:focus-within .field-hint {
    max-height: 60px;
    opacity: 1;
    transform: translateY(0);
    padding: 9px 12px;
}

.password-toggle {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 13px;
    color: #00684e;
    background: rgba(0, 104, 78, 0.08);
    cursor: pointer;
    font-size: 17px;
    transition: background 0.2s ease, transform 0.2s ease;
}

.password-toggle:hover {
    background: rgba(0, 104, 78, 0.14);
}

.password-toggle:active {
    transform: translateY(-50%) scale(0.96);
}

.message-box {
    min-height: 0;
    overflow: hidden;
    border-radius: 14px;
    color: #fff;
    background: linear-gradient(135deg, #d93025, #b42318);
    font-size: 14px;
    font-weight: 900;
    line-height: 1.45;
    opacity: 0;
    max-height: 0;
    padding: 0 14px;
    transform: translateY(-6px);
    transition: opacity 0.22s ease, max-height 0.22s ease, padding 0.22s ease, transform 0.22s ease;
}

.message-box.is-visible {
    opacity: 1;
    max-height: 82px;
    padding: 12px 14px;
    transform: translateY(0);
}

.submit-button {
    position: relative;
    width: 100%;
    height: 56px;
    overflow: hidden;
    border: 0;
    border-radius: 18px;
    color: #fff;
    background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 36%),
        linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 18px 34px rgba(0, 104, 78, 0.28);
    cursor: pointer;
    font-size: 17px;
    font-weight: 950;
    letter-spacing: 0.08em;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
}

.submit-button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -70%;
    width: 58%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.42), transparent);
    transform: skewX(-18deg);
    transition: left 0.72s ease;
}

.submit-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 44px rgba(0, 104, 78, 0.34);
    filter: saturate(1.05);
}

.submit-button:hover::before {
    left: 118%;
}

.submit-button.is-loading {
    pointer-events: none;
    filter: saturate(0.9);
}

.submit-button.is-loading .button-text {
    opacity: 0;
}

.button-loader {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
}

.submit-button.is-loading .button-loader {
    display: grid;
}

.loader-ring {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(255, 255, 255, 0.42);
    border-top-color: #fff;
    border-radius: 999px;
    animation: spin 0.78s linear infinite;
}

.login-note {
    margin: 16px 0 0;
    color: rgba(18, 48, 38, 0.70);
    font-size: 12px;
    line-height: 1.65;
    text-align: center;
    font-weight: 700;
}

.closed-panel {
    display: grid;
    place-items: center;
    gap: 12px;
    width: min(100%, 520px);
    padding: 34px 26px;
    border: 1px solid rgba(255, 255, 255, 0.82);
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.76);
    box-shadow: 0 28px 80px rgba(0, 72, 54, 0.22);
    backdrop-filter: blur(24px) saturate(145%);
    -webkit-backdrop-filter: blur(24px) saturate(145%);
    text-align: center;
}

.closed-icon {
    width: 74px;
    height: 74px;
    display: grid;
    place-items: center;
    border-radius: 28px;
    color: #fff;
    background: linear-gradient(135deg, #d93025, #b42318);
    box-shadow: 0 18px 38px rgba(185, 28, 28, 0.26);
    font-size: 34px;
    font-weight: 950;
}

.closed-title {
    margin: 0;
    color: #10271f;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 950;
}

.closed-text {
    margin: 0;
    color: rgba(18, 48, 38, 0.72);
    font-size: 15px;
    line-height: 1.7;
    font-weight: 800;
}

.shake {
    animation: shake 0.42s ease both;
}

@keyframes owlFloat {
    0%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        box-shadow: 0 18px 34px rgba(0, 72, 54, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }
    50% {
        transform: translate3d(0, -8px, 0) rotate(-1.2deg);
        box-shadow: 0 26px 42px rgba(0, 72, 54, 0.21), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }
}

@keyframes owlTinyTilt {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(1.8deg) scale(1.035); }
}

@keyframes owlGlow {
    0%, 100% { opacity: 0.50; transform: scale(0.94); }
    50% { opacity: 0.88; transform: scale(1.08); }
}

@keyframes auraRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes blobFloat {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to { transform: translate3d(24px, -18px, 0) scale(1.08); }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
}

@media (max-width: 480px) {
    .auth-page { padding-inline: 12px; }
    .login-card { width: min(100%, 420px); border-radius: 26px; padding: 26px 20px; }
    .login-logo { width: 76px; height: 76px; border-radius: 22px; margin-bottom: 14px; }
    .login-logo img { width: 58px; height: 58px; }
    .login-title { font-size: 26px; }
    .form-input { height: 52px; font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
