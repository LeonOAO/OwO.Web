<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>OwO Browser</title><link rel="icon" href="./assets/owo.svg" type="image/svg+xml"><link rel="stylesheet" href="./assets/browser.css"></head><body><div class="browser"><header><div class="tabs"><div class="brand"><img src="./assets/owo.svg" alt="OwO"><b>OwO Browser</b></div><div id="tabList"></div><button id="addTab">＋</button></div><div class="toolbar"><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><button id="home">⌂</button><form id="addressForm"><span>◇</span><input id="address" placeholder="搜尋或輸入網址" autocomplete="off"><button>前往</button></form><button id="star">☆</button><button id="settings">⋮</button></div><div id="progress"><i></i></div></header><main><section id="start"><img class="hero-logo" src="./assets/owo.svg" alt="OwO Logo"><h1>OwO Browser</h1><p>可愛、簡潔，像一般瀏覽器一樣使用分頁與網址列。</p><form id="startForm"><input id="startInput" placeholder="輸入網址，例如 example.com"><button>開啟</button></form><div class="shortcuts"><button data-url="https://www.wikipedia.org/"><b>W</b><small>Wikipedia</small></button><button data-url="https://www.google.com/"><b>G</b><small>Google</small></button><button data-url="https://github.com/"><b>GH</b><small>GitHub</small></button><button id="startSettings"><b>⚙</b><small>連線設定</small></button></div></section><section id="content" hidden><iframe id="frame" title="OwO Browser 內容"></iframe></section><section id="notice" hidden><div><img src="./assets/owo.svg" alt="OwO"><h2>OwO 引擎執行提示</h2><p id="noticeText"></p><button id="noticeHome">回到 OwO 首頁</button></div></section></main><footer><span id="status">OwO 已就緒</span><span id="connection">Scramjet · Wisp 尚未設定</span></footer></div><dialog id="settingsDialog"><form id="settingsForm" method="dialog"><header><div><small>OwO SETTINGS</small><h2>OwO 瀏覽器設定</h2></div><button value="cancel">×</button></header><fieldset><legend>處理引擎</legend><label><input type="radio" name="engine" value="scramjet"> Scramjet</label><label><input type="radio" name="engine" value="ultraviolet"> Ultraviolet</label></fieldset><label class="field">Wisp WebSocket 位址<input id="wisp" placeholder="wss://wisp.example.com/wisp/"></label><label class="check">啟動前連線檢測 <input id="preflight" type="checkbox"></label><div class="test"><i id="lamp"></i><span><b id="testTitle">尚未檢測</b><small id="testDetail">可先測試 OwO Wisp 連線。</small></span></div><footer><button id="testButton" type="button">測試連線</button><button value="save">儲存設定</button></footer></form></dialog><script src="./config.js"></script><script type="module" src="./js/browser.js"></script></body></html>
